<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>重返未来:1999 · 官网图画集</title>
    <style>
      :root {
        --bg: #0d0f12;
        --panel: #16191f;
        --panel-2: #1d2129;
        --line: #2a2f3a;
        --text: #e8e6e1;
        --muted: #8d94a3;
        --accent: #d8b26a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header {
        position: sticky; top: 0; z-index: 20;
        background: rgba(13, 15, 18, 0.92);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
        padding: 14px 20px 10px;
      }
      .title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
      .title h1 { font-size: 18px; margin: 0; letter-spacing: 0.08em; font-weight: 600; }
      .title h1 span { color: var(--accent); }
      .title .stat { color: var(--muted); font-size: 12.5px; }
      .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
      .bar input, .bar select {
        background: var(--panel-2); color: var(--text);
        border: 1px solid var(--line); border-radius: 6px;
        padding: 7px 10px; font-size: 13px; outline: none;
      }
      .bar input:focus, .bar select:focus { border-color: var(--accent); }
      .bar input[type="search"] { flex: 1 1 220px; min-width: 160px; }
      .bar .spacer { flex: 1 1 auto; }
      .chip {
        background: var(--panel-2); border: 1px solid var(--line);
        border-radius: 6px; padding: 7px 12px; font-size: 13px;
        color: var(--text); cursor: pointer; user-select: none;
      }
      .chip.on { border-color: var(--accent); color: var(--accent); }
      .chip:hover { background: #232936; }
      main { padding: 18px 20px 60px; }
      #count { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
      .grid {
        display: grid; gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      }
      .card {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      .card:hover { transform: translateY(-2px); border-color: #3d4553; }
      .thumb { position: relative; background: #0a0c0f; aspect-ratio: 16 / 10; display: flex; }
      .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
      .thumb .badge {
        position: absolute; top: 8px; left: 8px;
        font-size: 11px; padding: 3px 7px; border-radius: 4px;
        background: rgba(0, 0, 0, 0.62); color: #d8d5cd; letter-spacing: 0.04em;
      }
      .thumb .badge.pc { color: #9fd0ff; }
      .thumb .badge.phone { color: #ffc9a3; }
      .meta { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 5px; }
      .meta .name { font-size: 13px; line-height: 1.35; word-break: break-all; }
      .meta .sub { font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
      .meta .dl { font-size: 12px; color: var(--accent); text-decoration: none; margin-top: 2px; }
      .meta .dl:hover { text-decoration: underline; }
      .empty { color: var(--muted); padding: 60px 0; text-align: center; }
      dialog {
        border: none; background: transparent; padding: 0; max-width: 100vw; max-height: 100vh;
      }
      dialog::backdrop { background: rgba(0, 0, 0, 0.9); }
      dialog img { max-width: 96vw; max-height: 92vh; display: block; border-radius: 6px; }
      .hint { position: fixed; bottom: 10px; right: 14px; color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <div class="title">
        <h1>重返未来 1999 <span>· 官网图画集</span></h1>
        <span class="stat" id="stat">加载中…</span>
      </div>
      <div class="bar">
        <input type="search" id="q" placeholder="搜索名称 / 编号 / 分辨率（例如 2560x1440）" />
        <select id="date"><option value="">全部日期</option></select>
        <button class="chip on" data-orient="">全部</button>
        <button class="chip" data-orient="desktop">横版 PC</button>
        <button class="chip" data-orient="mobile">竖版 手机</button>
        <span class="spacer"></span>
        <button class="chip" id="mode">随机排序</button>
      </div>
    </header>
    <main>
      <p id="count"></p>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden>没有匹配的图片</div>
    </main>
    <div class="hint">点击缩略图放大 · 右键可另存为原图</div>
    <dialog id="viewer"><img id="viewerImg" alt="" /></dialog>

    <script>
      const DATA = __MANIFEST__;
      const state = { q: "", date: "", orient: "", shuffle: false, list: [] };

      const $ = (id) => document.getElementById(id);
      const grid = $("grid");

      function human(bytes) {
        if (!bytes) return "?";
        const u = ["B", "KB", "MB", "GB"];
        let i = 0, n = bytes;
        while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
        return n.toFixed(i === 0 ? 0 : 1) + u[i];
      }

      const items = (DATA.items || []).filter((it) => !it.error);

      $("stat").textContent =
        `${items.length} 张 · ${human(DATA.totalBytes)} · 采集于 ${new Date(DATA.crawledAt).toLocaleString("zh-CN")}`;

      const dates = [...new Set(items.map((it) => it.date))].sort().reverse();
      for (const d of dates) {
        const o = document.createElement("option");
        o.value = d; o.textContent = d;
        $("date").appendChild(o);
      }

      function apply() {
        const q = state.q.trim().toLowerCase();
        let list = items.filter((it) => {
          if (state.date && it.date !== state.date) return false;
          if (state.orient && it.orientation !== state.orient) return false;
          if (!q) return true;
          const hay = `${it.name} ${it.id} ${it.resolution || ""} ${it.title || ""} ${it.width}x${it.height}`.toLowerCase();
          return hay.includes(q);
        });
        if (state.shuffle) list = list.slice().sort(() => Math.random() - 0.5);
        render(list);
      }

      function render(list) {
        $("count").textContent = `显示 ${list.length} / ${items.length} 张`;
        $("empty").hidden = list.length > 0;
        const frag = document.createDocumentFragment();
        for (const it of list) {
          const card = document.createElement("div");
          card.className = "card";
          const badge =
            it.orientation === "desktop" ? "横版 PC" : it.orientation === "mobile" ? "竖版 手机" : "壁纸";
          const dim = it.width && it.height ? `${it.width}×${it.height}` : it.resolution || "";
          card.innerHTML = `
            <div class="thumb">
              <span class="badge ${it.orientation}">${badge}</span>
              <img loading="lazy" decoding="async" alt="${escapeHtml(it.name)}">
            </div>
            <div class="meta">
              <div class="name">${escapeHtml(it.name)}</div>
              <div class="sub"><span>#${it.id}</span><span>${it.date}</span><span>${dim}</span><span>${human(it.bytes)}</span></div>
              <a class="dl" download>下载原图</a>
            </div>`;
          const img = card.querySelector("img");
          const a = card.querySelector("a");
          const url = encodeURI(it.file);
          img.src = url;
          a.href = url;
          a.setAttribute("download", it.file.split("/").pop());
          img.addEventListener("click", () => {
            $("viewerImg").src = url;
            $("viewerImg").alt = it.name;
            $("viewer").showModal();
          });
          frag.appendChild(card);
        }
        grid.replaceChildren(frag);
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      $("q").addEventListener("input", (e) => { state.q = e.target.value; apply(); });
      $("date").addEventListener("change", (e) => { state.date = e.target.value; apply(); });
      $("mode").addEventListener("click", (e) => {
        state.shuffle = !state.shuffle;
        e.target.classList.toggle("on", state.shuffle);
        e.target.textContent = state.shuffle ? "按编号排序" : "随机排序";
        apply();
      });
      document.querySelectorAll(".chip[data-orient]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".chip[data-orient]").forEach((b) => b.classList.remove("on"));
          btn.classList.add("on");
          state.orient = btn.dataset.orient;
          apply();
        });
      });
      $("viewer").addEventListener("click", () => $("viewer").close());
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("viewer").close(); });

      apply();
    </script>
  </body>
</html>
