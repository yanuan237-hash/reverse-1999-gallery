<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>重返未来 1999 · 图画集下载器</title>
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #14171d;
        --panel2: #1b1f27;
        --line: #262b35;
        --text: #e9e7e2;
        --muted: #8b93a2;
        --accent: #d8b26a;
        --ok: #6ecf8f;
        --bad: #ef6a6a;
        --blue: #7cb8ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg); color: var(--text);
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        font-size: 14px; overflow: hidden;
      }
      .app { display: flex; flex-direction: column; height: 100vh; }

      /* 顶栏 */
      header {
        display: flex; align-items: center; gap: 14px;
        padding: 10px 16px; border-bottom: 1px solid var(--line);
        background: var(--panel); flex: 0 0 auto;
      }
      header .brand { font-weight: 600; letter-spacing: .06em; }
      header .brand span { color: var(--accent); }
      header .grow { flex: 1; }
      .tabs { display: flex; gap: 6px; }
      .tab {
        padding: 7px 14px; border-radius: 8px; cursor: pointer; color: var(--muted);
        border: 1px solid transparent; user-select: none; white-space: nowrap;
      }
      .tab:hover { background: var(--panel2); color: var(--text); }
      .tab.on { background: var(--panel2); border-color: var(--line); color: var(--accent); }
      .tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); margin-left: 6px; vertical-align: 1px; }

      /* 内容 */
      main { flex: 1; min-height: 0; display: flex; }
      .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
      .view.on { display: flex; }

      /* 工具条 */
      .bar {
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        padding: 10px 16px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
        background: #101318;
      }
      .bar input, .bar select {
        background: var(--panel2); color: var(--text); border: 1px solid var(--line);
        border-radius: 7px; padding: 7px 10px; outline: none; font-size: 13px;
      }
      .bar input:focus, .bar select:focus { border-color: var(--accent); }
      .bar input[type="search"] { flex: 1 1 200px; min-width: 140px; }
      .btn {
        background: var(--panel2); color: var(--text); border: 1px solid var(--line);
        border-radius: 7px; padding: 7px 13px; cursor: pointer; font-size: 13px; white-space: nowrap;
      }
      .btn:hover { background: #232936; }
      .btn:disabled { opacity: .45; cursor: not-allowed; }
      .btn.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 600; }
      .btn.primary:hover { filter: brightness(1.08); }
      .btn.on { border-color: var(--accent); color: var(--accent); }
      .sep { width: 1px; height: 20px; background: var(--line); }

      /* 网格 */
      .scroll { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px 40px; }
      .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
      .card {
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        overflow: hidden; display: flex; flex-direction: column; position: relative;
        transition: border-color .12s, transform .12s;
      }
      .card:hover { border-color: #3c4453; transform: translateY(-2px); }
      .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
      .thumb { position: relative; background: #0a0c0f; aspect-ratio: 16/10; overflow: hidden; }
      .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
      .thumb .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #3a424f; font-size: 12px; }
      .badge {
        position: absolute; top: 7px; left: 7px; font-size: 11px; padding: 3px 7px;
        border-radius: 5px; background: rgba(0,0,0,.66); color: #ddd;
      }
      .badge.pc { color: var(--blue); }
      .badge.phone { color: #ffc9a3; }
      .check {
        position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border-radius: 6px;
        border: 1.5px solid rgba(255,255,255,.55); background: rgba(0,0,0,.45);
        display: flex; align-items: center; justify-content: center; cursor: pointer;
        font-size: 14px; color: transparent;
      }
      .card.sel .check { background: var(--accent); border-color: var(--accent); color: #1a1408; }
      .meta { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; }
      .meta .name { font-size: 12.5px; line-height: 1.35; word-break: break-all; }
      .meta .sub { font-size: 11px; color: var(--muted); display: flex; gap: 7px; flex-wrap: wrap; }
      .meta .id { color: var(--muted); }

      /* 进度条 */
      .progress { flex: 0 0 auto; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); }
      .progress .top { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--muted); }
      .progress .track { height: 7px; background: #20242e; border-radius: 4px; margin-top: 8px; overflow: hidden; }
      .progress .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #f0d9a8); transition: width .2s; }
      .progress .log { margin-top: 8px; height: 74px; overflow: auto; font-family: Consolas, monospace; font-size: 11.5px; color: var(--muted); }
      .progress .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .progress .log .ok { color: var(--ok); }
      .progress .log .fail { color: var(--bad); }
      .progress .log .skip { color: #6d7684; }

      /* 设置 */
      .settings { padding: 24px 28px; max-width: 720px; overflow: auto; }
      .field { margin-bottom: 20px; }
      .field label { display: block; font-size: 13px; margin-bottom: 7px; }
      .field .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
      .field input[type="text"], .field input[type="number"] {
        width: 100%; background: var(--panel2); color: var(--text);
        border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; outline: none;
      }
      .field input:focus { border-color: var(--accent); }
      .row { display: flex; gap: 10px; align-items: center; }
      .saved { color: var(--ok); font-size: 12.5px; margin-left: 10px; opacity: 0; transition: opacity .2s; }
      .saved.on { opacity: 1; }

      /* 大图查看 */
      dialog { border: none; background: transparent; padding: 0; }
      dialog::backdrop { background: rgba(0,0,0,.92); }
      dialog img { max-width: 94vw; max-height: 92vh; display: block; border-radius: 6px; }
      .empty { text-align: center; color: var(--muted); padding: 70px 0; }
      .toast {
        position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
        background: var(--panel2); border: 1px solid var(--line); color: var(--text);
        padding: 10px 16px; border-radius: 9px; font-size: 13px; opacity: 0; pointer-events: none;
        transition: opacity .2s; z-index: 99;
      }
      .toast.on { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand">重返未来 1999 <span>· 图画集下载器</span></div>
        <div class="grow"></div>
        <div class="tabs">
          <div class="tab on" data-view="online">官网图集</div>
          <div class="tab" data-view="local">本地画廊 <span class="dot" id="localDot" hidden></span></div>
          <div class="tab" data-view="settings">设置</div>
        </div>
      </header>

      <main>
        <!-- ================= 官网图集 ================= -->
        <section class="view on" id="view-online">
          <div class="bar">
            <button class="btn" id="loadRemote">加载官网图集</button>
            <input type="search" id="q" placeholder="搜索名称 / 编号 / 分辨率，如 2560x1440" />
            <select id="dateSel"><option value="">全部日期</option></select>
            <button class="btn on" data-orient="">全部</button>
            <button class="btn" data-orient="desktop">横版 PC</button>
            <button class="btn" data-orient="mobile">竖版 手机</button>
            <span class="sep"></span>
            <button class="btn" id="selAll">全选</button>
            <button class="btn" id="selNone">清空</button>
            <span class="grow" style="flex:1"></span>
            <span id="selInfo" style="color:var(--muted);font-size:12.5px"></span>
            <button class="btn primary" id="dlSel" disabled>下载选中</button>
          </div>
          <div class="scroll">
            <div id="onlineMeta" class="empty">点「加载官网图集」从 re.bluepoch.com 获取最新图画集清单</div>
            <div class="grid" id="onlineGrid"></div>
          </div>
        </section>

        <!-- ================= 本地画廊 ================= -->
        <section class="view" id="view-local">
          <div class="bar">
            <button class="btn" id="reloadLocal">重新扫描</button>
            <input type="search" id="q2" placeholder="搜索名称 / 编号" />
            <select id="dateSel2"><option value="">全部日期</option></select>
            <button class="btn on" data-orient2="">全部</button>
            <button class="btn" data-orient2="desktop">横版 PC</button>
            <button class="btn" data-orient2="mobile">竖版 手机</button>
            <span style="flex:1"></span>
            <span id="localInfo" style="color:var(--muted);font-size:12.5px"></span>
          </div>
          <div class="scroll">
            <div id="localMeta" class="empty">还没有下载过的图片</div>
            <div class="grid" id="localGrid"></div>
          </div>
        </section>

        <!-- ================= 设置 ================= -->
        <section class="view" id="view-settings">
          <div class="settings">
            <div class="field">
              <label>保存目录</label>
              <input type="text" id="setOutDir" spellcheck="false" />
              <div class="hint">图片会保存到 <code>&lt;保存目录&gt;\wallpapers\&lt;日期&gt;\</code>，并生成 manifest.json 清单。</div>
            </div>
            <div class="field">
              <label>并发下载数</label>
              <input type="number" id="setConc" min="1" max="32" />
              <div class="hint">建议 6–12。太高可能被 CDN 限速。</div>
            </div>
            <div class="field">
              <label>缩略图尺寸（像素）</label>
              <input type="number" id="setThumbSize" min="200" max="900" />
              <div class="hint">影响界面缩略图清晰度与生成速度。原图下载不受影响。</div>
            </div>
            <div class="field">
              <label>缩略图质量</label>
              <input type="number" id="setThumbQ" min="40" max="95" />
            </div>
            <div class="field">
              <label>HTTP 代理（可选）</label>
              <input type="text" id="setProxy" placeholder="例如 http://127.0.0.1:7890" spellcheck="false" />
              <div class="hint">留空表示直连。代理需在重启应用后生效。</div>
            </div>
            <div class="row">
              <button class="btn primary" id="saveSettings">保存设置</button>
              <button class="btn" id="clearThumb">清空缩略图缓存</button>
              <span class="saved" id="savedTip">已保存</span>
            </div>
          </div>
        </section>
      </main>

      <!-- ================= 下载进度 ================= -->
      <div class="progress" id="progress" hidden>
        <div class="top">
          <span id="pTitle">准备中…</span>
          <span style="flex:1"></span>
          <span id="pStat"></span>
          <button class="btn" id="pHide">收起</button>
        </div>
        <div class="track"><div class="fill" id="pFill"></div></div>
        <div class="log" id="pLog"></div>
      </div>
    </div>

    <dialog id="viewer"><img id="viewerImg" alt="" /></dialog>
    <div class="toast" id="toast"></div>

    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];
      /** 带重试的请求：服务刚启动时浏览器可能先打开了，这里自动重连 */
      async function api(p, opt, retries = 6) {
        let lastErr;
        for (let i = 0; i < retries; i++) {
          try {
            const r = await fetch(p, opt);
            if (r.status >= 500) throw new Error("HTTP " + r.status);
            return await r.json();
          } catch (e) {
            lastErr = e;
            if (i < retries - 1) await new Promise((res) => setTimeout(res, 600 * (i + 1)));
          }
        }
        throw lastErr ?? new Error("请求失败");
      }
      let toastTimer;
      function toast(msg) {
        const t = $("#toast");
        t.textContent = msg;
        t.classList.add("on");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("on"), 2200);
      }
      const human = (b) => {
        if (!b) return "0B";
        const u = ["B", "KB", "MB", "GB"];
        let i = 0, n = b;
        while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
        return n.toFixed(i === 0 ? 0 : 1) + u[i];
      };
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      /* ---------------- 视图切换 ---------------- */
      $$(".tab").forEach((t) =>
        t.addEventListener("click", () => {
          $$(".tab").forEach((x) => x.classList.remove("on"));
          t.classList.add("on");
          $$(".view").forEach((v) => v.classList.remove("on"));
          $("#view-" + t.dataset.view).classList.add("on");
          if (t.dataset.view === "local") loadLocal();
        }),
      );

      /* ---------------- 官网图集 ---------------- */
      const S = { items: [], sel: new Set(), q: "", date: "", orient: "" };

      async function loadRemote() {
        $("#onlineMeta").className = "empty";
        $("#onlineMeta").textContent = "正在获取官网清单…";
        $("#onlineGrid").innerHTML = "";
        try {
          const r = await api("/api/remote");
          if (!r.ok) throw new Error(r.error);
          S.items = r.items;
          const dates = [...new Set(r.items.map((i) => i.date))].sort().reverse();
          $("#dateSel").innerHTML = '<option value="">全部日期</option>' + dates.map((d) => `<option>${d}</option>`).join("");
          $("#onlineMeta").className = "empty";
          $("#onlineMeta").textContent = `共 ${r.items.length} 张 · 保存到 ${r.settings.outDir}`;
          renderOnline();
        } catch (e) {
          $("#onlineMeta").textContent = "加载失败：" + e.message;
        }
      }

      /** 加载缩略图；若服务端返回 204（渐进式图片），回退为原图直链 */
      function loadThumb(img, url, card) {
        const thumbUrl = "/api/thumb?u=" + encodeURIComponent(url);
        fetch(thumbUrl)
          .then(async (r) => {
            if (r.status === 204) {
              img.src = url; // 渐进式：直接用官网原图
              return;
            }
            if (!r.ok) throw new Error("HTTP " + r.status);
            const blob = await r.blob();
            img.src = URL.createObjectURL(blob);
          })
          .catch(() => { card.querySelector(".ph").textContent = "缩略图失败"; })
          .finally(() => {
            img.addEventListener("load", () => { const ph = card.querySelector(".ph"); if (ph) ph.remove(); }, { once: true });
          });
      }

      function filtered() {        const q = S.q.trim().toLowerCase();
        return S.items.filter((it) => {
          if (S.date && it.date !== S.date) return false;
          if (S.orient && it.orientation !== S.orient) return false;
          if (!q) return true;
          return `${it.name} ${it.id} ${it.resolution ?? ""} ${it.title ?? ""}`.toLowerCase().includes(q);
        });
      }

      function renderOnline() {
        const list = filtered();
        const grid = $("#onlineGrid");
        grid.innerHTML = "";
        const frag = document.createDocumentFragment();
        for (const it of list) {
          const card = document.createElement("div");
          card.className = "card" + (S.sel.has(it.id) ? " sel" : "");
          card.dataset.id = it.id;
          const badge = it.orientation === "desktop" ? "横版 PC" : "竖版 手机";
          card.innerHTML = `
            <div class="thumb">
              <div class="ph">载入中…</div>
              <span class="badge ${it.orientation}">${badge}</span>
              <div class="check">✓</div>
            </div>
            <div class="meta">
              <div class="name">${esc(it.name)}</div>
              <div class="sub"><span class="id">#${it.id}</span><span>${it.date}</span><span>${esc(it.resolution ?? "")}</span></div>
            </div>`;
          const img = document.createElement("img");
          img.loading = "lazy";
          img.decoding = "async";
          loadThumb(img, it.pictureUrl, card);
          card.querySelector(".thumb").appendChild(img);

          const toggle = (e) => {
            e.stopPropagation();
            if (S.sel.has(it.id)) S.sel.delete(it.id);
            else S.sel.add(it.id);
            card.classList.toggle("sel", S.sel.has(it.id));
            updateSel();
          };
          card.querySelector(".check").addEventListener("click", toggle);
          img.addEventListener("click", () => openViewer(img.src, it.name));
          card.addEventListener("click", toggle);
          frag.appendChild(card);
        }
        grid.appendChild(frag);
        updateSel();
      }

      function updateSel() {
        $("#selInfo").textContent = S.sel.size ? `已选 ${S.sel.size} 张` : "";
        $("#dlSel").disabled = S.sel.size === 0;
      }

      $("#loadRemote").addEventListener("click", loadRemote);
      $("#q").addEventListener("input", (e) => { S.q = e.target.value; renderOnline(); });
      $("#dateSel").addEventListener("change", (e) => { S.date = e.target.value; renderOnline(); });
      $$("[data-orient]").forEach((b) =>
        b.addEventListener("click", () => {
          $$("[data-orient]").forEach((x) => x.classList.remove("on"));
          b.classList.add("on");
          S.orient = b.dataset.orient;
          renderOnline();
        }),
      );
      $("#selAll").addEventListener("click", () => { filtered().forEach((i) => S.sel.add(i.id)); renderOnline(); });
      $("#selNone").addEventListener("click", () => { S.sel.clear(); renderOnline(); });

      /* ---------------- 下载 + 进度 ---------------- */
      let es = null;
      let pollTimer = null;
      let lastEventAt = 0;

      /** SSE 之外的兜底轮询：流断了也能看到进度 */
      function ensurePolling() {
        if (pollTimer) return;
        pollTimer = setInterval(async () => {
          const silent = Date.now() - lastEventAt > 5000;
          try {
            const { job } = await api("/api/status");
            if (!job) return;
            // SSE 正常时不要和它抢着刷界面，只在流静默时才接管
            if (silent && !$("#progress").hidden) {
              const pct = job.total ? Math.round((job.done / job.total) * 100) : 0;
              $("#pFill").style.width = pct + "%";
              $("#pTitle").textContent = job.finished ? "下载完成" : `下载中 ${job.done}/${job.total}`;
              $("#pStat").textContent = `${job.ok} 新增 · ${job.skip} 跳过 · ${job.fail} 失败 · ${human(job.bytes)}`;
            }
            if (job.finished && !job.polled) {
              job.polled = true;
              if (job.error) toast("下载失败：" + job.error);
              else toast(`完成：新增 ${job.ok} 张，跳过 ${job.skip} 张，失败 ${job.fail} 张`);
              loadLocal(true);
            }
          } catch { /* 忽略 */ }
        }, 2500);
      }

      function ensureStream() {
        if (es) return;
        es = new EventSource("/api/progress");
        es.addEventListener("hello", (ev) => {
          const d = JSON.parse(ev.data);
          if (d && !d.finished) { showProgress(); applyStat(d); d.recent?.forEach(addLog); }
        });
        for (const t of ["ok", "skip", "fail"]) es.addEventListener(t, (ev) => { applyStat(JSON.parse(ev.data)); addLog(JSON.parse(ev.data)); });
        es.addEventListener("done", (ev) => {
          const d = JSON.parse(ev.data);
          $("#pTitle").textContent = d.ok ? "下载完成" : "下载中断";
          $("#pFill").style.width = "100%";
          toast(d.ok ? `完成：新增 ${d.ok_count ?? 0} 张，跳过 ${d.skip ?? 0} 张，失败 ${d.fail ?? 0} 张` : "失败：" + d.error);
          setTimeout(() => { $("#localDot").hidden = false; }, 10);
          loadLocal(true);
        });
      }
      function showProgress() { $("#progress").hidden = false; }
      function applyStat(d) {
        lastEventAt = Date.now();
        showProgress();
        const pct = d.total ? Math.round((d.done / d.total) * 100) : 0;
        $("#pFill").style.width = pct + "%";
        $("#pTitle").textContent = `下载中 ${d.done}/${d.total}`;
        $("#pStat").textContent = `${pct}% · ${human(d.bytesTotal ?? 0)} · ${d.elapsed ? (d.elapsed / 1000).toFixed(0) + "s" : ""}`;
      }
      function addLog(d) {
        const box = $("#pLog");
        const div = document.createElement("div");
        div.className = d.type;
        div.textContent = `${d.type === "fail" ? "✗" : d.type === "skip" ? "·" : "✓"} ${d.label ?? ""} ${d.bytes ? human(d.bytes) : ""} ${d.msg ?? ""}`;
        box.appendChild(div);
        while (box.childElementCount > 200) box.removeChild(box.firstChild);
        box.scrollTop = box.scrollHeight;
      }
      $("#pHide").addEventListener("click", () => { $("#progress").hidden = true; });

      $("#dlSel").addEventListener("click", async () => {
        const items = S.items.filter((i) => S.sel.has(i.id));
        if (!items.length) return;
        $("#pLog").innerHTML = "";
        showProgress();
        $("#pTitle").textContent = `准备下载 ${items.length} 张…`;
        ensureStream();
        const r = await api("/api/download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items }),
        });
        if (!r.ok) toast("无法开始：" + r.error);
      });

      /* ---------------- 本地画廊 ---------------- */
      const L = { items: [], q: "", date: "", orient: "" };
      async function loadLocal(silent) {
        try {
          const r = await api("/api/library");
          if (!r.ok) throw new Error(r.error);
          L.items = r.items;
          $("#localDot").hidden = r.items.length > 0;
          $("#dateSel2").innerHTML = '<option value="">全部日期</option>' + r.dates.map((d) => `<option>${d}</option>`).join("");
          $("#localInfo").textContent = r.items.length ? `${r.items.length} 张 · ${human(r.totalBytes)}` : "";
          $("#localMeta").className = "empty";
          $("#localMeta").textContent = r.items.length
            ? `目录：${r.imgDir}`
            : "还没有下载过的图片，去「官网图集」选一些下载吧";
          renderLocal();
        } catch (e) {
          if (!silent) $("#localMeta").textContent = "读取失败：" + e.message;
        }
      }
      function renderLocal() {
        const q = L.q.trim().toLowerCase();
        const list = L.items.filter((it) => {
          if (L.date && it.date !== L.date) return false;
          if (L.orient && it.orientation !== L.orient) return false;
          if (!q) return true;
          return `${it.name} ${it.id} ${it.resolution ?? ""}`.toLowerCase().includes(q);
        });
        $("#localInfo").textContent = `${list.length} / ${L.items.length} 张`;
        const grid = $("#localGrid");
        grid.innerHTML = "";
        const frag = document.createDocumentFragment();
        for (const it of list) {
          const card = document.createElement("div");
          card.className = "card";
          const badge = it.orientation === "desktop" ? "横版 PC" : "竖版 手机";
          card.innerHTML = `
            <div class="thumb">
              <div class="ph">载入中…</div>
              <span class="badge ${it.orientation}">${badge}</span>
            </div>
            <div class="meta">
              <div class="name">${esc(it.name)}</div>
              <div class="sub"><span class="id">#${it.id}</span><span>${it.date}</span><span>${it.width ?? "?"}×${it.height ?? "?"}</span><span>${human(it.bytes)}</span></div>
            </div>`;
          const img = document.createElement("img");
          img.loading = "lazy";
          img.src = "/api/file?f=" + encodeURIComponent(it.file);
          img.onload = () => { const ph = card.querySelector(".ph"); if (ph) ph.remove(); };
          img.onerror = () => { card.querySelector(".ph").textContent = "打不开"; };
          img.addEventListener("click", () => openViewer(img.src, it.name));
          card.querySelector(".thumb").appendChild(img);
          frag.appendChild(card);
        }
        grid.appendChild(frag);
      }
      $("#reloadLocal").addEventListener("click", () => loadLocal());
      $("#q2").addEventListener("input", (e) => { L.q = e.target.value; renderLocal(); });
      $("#dateSel2").addEventListener("change", (e) => { L.date = e.target.value; renderLocal(); });
      $$("[data-orient2]").forEach((b) =>
        b.addEventListener("click", () => {
          $$("[data-orient2]").forEach((x) => x.classList.remove("on"));
          b.classList.add("on");
          L.orient = b.dataset.orient2;
          renderLocal();
        }),
      );

      /* ---------------- 大图 / 设置 ---------------- */
      function openViewer(src, alt) {
        $("#viewerImg").src = src;
        $("#viewerImg").alt = alt ?? "";
        $("#viewer").showModal();
      }
      $("#viewer").addEventListener("click", () => $("#viewer").close());
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#viewer").close(); });

      async function loadSettings() {
        const s = await api("/api/settings");
        $("#setOutDir").value = s.outDir;
        $("#setConc").value = s.concurrency;
        $("#setThumbSize").value = s.thumbSize;
        $("#setThumbQ").value = s.thumbQuality;
        $("#setProxy").value = s.proxy ?? "";
      }
      $("#saveSettings").addEventListener("click", async () => {
        const r = await api("/api/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            outDir: $("#setOutDir").value,
            concurrency: Number($("#setConc").value),
            thumbSize: Number($("#setThumbSize").value),
            thumbQuality: Number($("#setThumbQ").value),
            proxy: $("#setProxy").value,
          }),
        });
        $("#savedTip").classList.add("on");
        setTimeout(() => $("#savedTip").classList.remove("on"), 1600);
        toast("设置已保存");
      });
      $("#clearThumb").addEventListener("click", async () => {
        await api("/api/thumb-clear", { method: "POST" }).catch(() => {});
        toast("缩略图缓存已清空");
      });

      /* ---------------- 启动 ---------------- */
      loadSettings();
      loadLocal(true);
      ensureStream();
      ensurePolling();
      $("#localDot").hidden = true;
    </script>
  </body>
</html>
